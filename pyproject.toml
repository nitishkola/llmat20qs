[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmat20qs"
version = "0.1.0"
description = "Controlled LLM experiments for the game of 20 Questions"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.10,<2",
    "transformers>=4.57,<5",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
dev = ["pylint>=3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
